name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 단위 테스트 + 디버그 APK 빌드 + 안드로이드 lint + 출시용(R8 축소) 빌드 확인. 출시용은 여기서는 서명하지 않음
      - name: Build debug APK, run lint, check release build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApkExtractor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
